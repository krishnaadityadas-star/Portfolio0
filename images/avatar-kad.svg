<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1711" />
      <stop offset="100%" stop-color="#040a07" />
    </linearGradient>
    <linearGradient id="neon-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="50%" stop-color="#60efff" />
      <stop offset="100%" stop-color="#00ff87" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="200" cy="200" r="180" fill="url(#avatar-bg)" stroke="#1a3b2b" stroke-width="2" />
  
  <!-- Outer Rotating Ring Pattern -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#neon-stroke)" stroke-width="2" stroke-dasharray="16, 8, 4, 8" opacity="0.8" filter="url(#glow)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#254d3b" stroke-width="1.5" stroke-dasharray="4, 4" opacity="0.6" />

  <!-- Center Hexagon / Shield -->
  <polygon points="200,90 295,145 295,255 200,310 105,255 105,145" fill="#0c1f17" stroke="url(#neon-stroke)" stroke-width="2.5" />

  <!-- Monogram Symbol -->
  <text x="200" y="195" text-anchor="middle" fill="#00ff87" font-family="'Courier New', monospace" font-size="44" font-weight="bold" letter-spacing="4" filter="url(#glow)">&lt;KAD/&gt;</text>
  
  <text x="200" y="235" text-anchor="middle" fill="#60efff" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="3">SST · BITS PILANI</text>
  <text x="200" y="258" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10" letter-spacing="2">CS &amp; AI BUILDER</text>

  <!-- Live Pulse Dot -->
  <circle cx="200" cy="285" r="4" fill="#00ff87" filter="url(#glow)" />
</svg>
