<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a120e" />
      <stop offset="100%" stop-color="#050807" />
    </linearGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16382b" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)" />
  <rect width="800" height="450" fill="url(#grid-pattern)" />

  <!-- Outer Window Frame -->
  <rect x="60" y="45" width="680" height="360" rx="12" fill="#0d1f17" stroke="#00ff87" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Window Header -->
  <rect x="60" y="45" width="680" height="38" rx="12" fill="#142c22" />
  <circle cx="85" cy="64" r="6" fill="#ff5f56" />
  <circle cx="105" cy="64" r="6" fill="#ffbd2e" />
  <circle cx="125" cy="64" r="6" fill="#27c93f" />
  <text x="400" y="69" text-anchor="middle" fill="#60efff" font-family="monospace" font-size="13" letter-spacing="2">CYBERGRID // FLEXBOX ENGINE</text>

  <!-- Game Arena Visual -->
  <rect x="90" y="105" width="620" height="270" rx="8" fill="#08140f" stroke="#1c4736" stroke-width="1" />
  
  <!-- Flex Container Representation -->
  <rect x="115" y="130" width="570" height="90" rx="6" fill="#0f261c" stroke="#00ff87" stroke-dasharray="4,4" stroke-width="1.5" />
  <text x="130" y="150" fill="#00ff87" font-family="monospace" font-size="11">display: flex; justify-content: space-between; align-items: center;</text>

  <!-- Flex Items -->
  <rect x="135" y="165" width="100" height="42" rx="4" fill="#00ff87" fill-opacity="0.2" stroke="#00ff87" stroke-width="1.5" />
  <text x="185" y="190" text-anchor="middle" fill="#00ff87" font-family="monospace" font-size="12" font-weight="bold">FLEX 01</text>

  <rect x="270" y="165" width="100" height="42" rx="4" fill="#60efff" fill-opacity="0.2" stroke="#60efff" stroke-width="1.5" />
  <text x="320" y="190" text-anchor="middle" fill="#60efff" font-family="monospace" font-size="12" font-weight="bold">FLEX 02</text>

  <rect x="405" y="165" width="100" height="42" rx="4" fill="#00ff87" fill-opacity="0.2" stroke="#00ff87" stroke-width="1.5" />
  <text x="455" y="190" text-anchor="middle" fill="#00ff87" font-family="monospace" font-size="12" font-weight="bold">FLEX 03</text>

  <rect x="565" y="165" width="100" height="42" rx="4" fill="#60efff" fill-opacity="0.2" stroke="#60efff" stroke-width="1.5" />
  <text x="615" y="190" text-anchor="middle" fill="#60efff" font-family="monospace" font-size="12" font-weight="bold">TARGET 🎯</text>

  <!-- Controls HUD / Stats -->
  <rect x="115" y="240" width="270" height="115" rx="6" fill="#0c1d16" stroke="#1c4736" stroke-width="1" />
  <text x="135" y="265" fill="#94a3b8" font-family="monospace" font-size="11">LEVEL: 07 // MASTERY</text>
  <text x="135" y="290" fill="#00ff87" font-family="monospace" font-size="13">> flex-direction: row;</text>
  <text x="135" y="315" fill="#60efff" font-family="monospace" font-size="13">> align-items: stretch;</text>
  <text x="135" y="338" fill="#e2e8f0" font-family="monospace" font-size="11">SCORE: 2,450 PTS</text>

  <rect x="415" y="240" width="270" height="115" rx="6" fill="#0c1d16" stroke="#1c4736" stroke-width="1" />
  <text x="435" y="265" fill="#94a3b8" font-family="monospace" font-size="11">CSS INSPECTOR HUD</text>
  <text x="435" y="290" fill="#a7f3d0" font-family="monospace" font-size="12">Box Model: 24px Padding</text>
  <text x="435" y="312" fill="#a7f3d0" font-family="monospace" font-size="12">Margin: 12px Auto</text>
  <text x="435" y="335" fill="#00ff87" font-family="monospace" font-size="12">Status: Synced ✓</text>
</svg>
